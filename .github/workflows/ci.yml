name: ci

# The whole suite needs no network, no credentials and no build step, so it
# runs on every push in about twenty seconds. `test/live.test.mjs` SKIPS
# without an endpoint rather than failing — the default suite must need zero
# real dependencies.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        node: [22, 24, 26]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: "${{ matrix.node }}" }
      - run: npm run ci
