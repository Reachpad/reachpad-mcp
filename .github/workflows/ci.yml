name: ci

# The whole suite needs no network, no credentials and no build step, so it
# runs on every push in about twenty seconds. `test/live.test.mjs` SKIPS
# without an endpoint rather than failing — the default suite must need zero
# real dependencies.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - run: node --test 'test/*.test.mjs'
      # The package is what ships, not the repository. A `files` entry that
      # drifts is how a test fixture or a stray note reaches a registry, so the
      # contents are asserted rather than assumed.
      - name: the tarball contains exactly what it should
        run: |
          npm pack --dry-run --json > /tmp/pack.json
          node -e '
            const [p] = require("/tmp/pack.json");
            const files = p.files.map(f => f.path).sort();
            const expected = [
              "README.md", "package.json",
              "src/client.js", "src/errors.js", "src/http.js",
              "src/server.js", "src/tools.js",
            ].sort();
            const same = files.length === expected.length &&
              files.every((f, i) => f === expected[i]);
            if (!same) {
              console.error("packed:", files);
              console.error("expected:", expected);
              process.exit(1);
            }
            console.log("tarball is", p.size, "bytes,", files.length, "files");
          '
