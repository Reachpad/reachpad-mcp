name: publish

# A PR bumps the version; PUSHING THE TAG publishes. Nothing outward happens on
# a merge to main, so a release is always a deliberate act.
#
#   git tag v0.1.1 && git push origin v0.1.1
#
# Trusted Publishing (OIDC): there is NO npm token in this repository. npm mints
# a short-lived credential for this workflow in this repository, so there is no
# long-lived secret to steal, rotate, or find in a password manager years from
# now. Configure it once at npmjs.com on the package:
#
#   Settings -> Trusted Publisher -> GitHub Actions
#   org Reachpad · repo reachpad-mcp · workflow publish.yml
#   ENVIRONMENT: npm-publish   <-- NOT blank. Read the next paragraph.
#
# THE ENVIRONMENT NAME IS LOAD-BEARING, and it is the reason this workflow is
# three jobs instead of one. `id-token: write` mints a token for ANY audience
# the holder asks for, so any step in a job that has it can ask for
# `npm:registry.npmjs.org` — and npm's Trusted Publisher check only looks at
# repository + workflow file, both of which every job here shares. The one
# claim that differs per job is `environment`. So: the npm publish runs in the
# `npm-publish` environment and NOTHING ELSE does, and npm is configured to
# accept only that environment. A token minted in the `registry` job — the one
# that runs a third-party binary — carries no environment claim and npm
# refuses it.
#
# Consequence, and it is a one-time coordinated change: until the Trusted
# Publisher entry names `npm-publish`, the npm step fails closed with an OIDC
# mismatch. Set it before the next tag.
#
# The `npm-publish` environment also carries the human gate: deployments from
# `v*` tags only, and a required reviewer. Same posture as the CLI's
# `release-signing`, which is the sibling artifact with LESS exposure.
#
# `workflow_dispatch` used to be here as a second publish path. It is gone: a
# dispatch runs from a BRANCH, and a branch is exactly what the tag assertion
# below exists to refuse.

on:
  push:
    tags: ["v*"]

permissions: {}

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

# The pinned MCP registry publisher. `releases/latest/download/` used to be
# used here, which resolved at run time to whatever that third-party pipeline
# had most recently produced — no version, no checksum, no signature, executed
# in a job holding a live OIDC minting capability. RE-PIN BOTH LINES ON
# UPGRADE: the digest is the linux/amd64 tarball's, taken from
# `registry_<version>_checksums.txt` in the same release and confirmed by
# downloading and hashing it independently (2026-09-01).
env:
  MCP_PUBLISHER_VERSION: v1.8.1
  MCP_PUBLISHER_SHA256: a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc

jobs:
  # Everything that can be decided WITHOUT a credential, decided here. This
  # job has no `id-token`, so the third-party tarball it fetches is downloaded
  # by a job that could not mint an OIDC token if the tarball asked it to.
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: "22" }

      # A TAG, not a name that looks like one. This used to read
      # `${GITHUB_REF_NAME#v}`, which is the branch name on a branch build —
      # so a branch literally called `v0.4.2`, which anyone with write access
      # can push, satisfied a check meant to mean "this is a release".
      - name: the ref must be a tag
        run: |
          if [ "${{ github.ref_type }}" != "tag" ]; then
            echo "::error::refusing to publish from ${{ github.ref_type }} ${{ github.ref }}"
            exit 1
          fi
          case "$GITHUB_REF" in
            refs/tags/v*) ;;
            *) echo "::error::not a v* tag ref: $GITHUB_REF"; exit 1 ;;
          esac

      - name: install the exact npm used to publish
        run: |
          npm install -g npm@11.5.1 --ignore-scripts
          actual_npm="$(npm --version)"
          if [ "$actual_npm" != "11.5.1" ]; then
            echo "::error::npm bootstrap installed $actual_npm; expected 11.5.1"
            exit 1
          fi

      - name: test and retain the exact npm artifact
        run: REACHPAD_PACKAGE_ARTIFACT=reachpad-mcp.tgz npm run ci

      - name: the tag must name the version being published
        run: |
          tag="${GITHUB_REF#refs/tags/v}"
          pkg=$(node -p "require('./package.json').version")
          if [ "$tag" != "$pkg" ]; then
            echo "::error::tag v$tag does not match package.json $pkg"
            exit 1
          fi

      # Fetched and checked HERE so the bytes that reach the privileged job
      # are bytes this job already vouched for. The digest is the gate; the
      # download URL is only how the bytes arrive.
      - name: fetch mcp-publisher at the pinned version and verify its digest
        run: |
          curl -fsSL --proto '=https' --proto-redir '=https' \
            --connect-timeout 10 --max-time 120 -o mcp-publisher.tar.gz \
            "https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}/mcp-publisher_linux_amd64.tar.gz"
          echo "${MCP_PUBLISHER_SHA256}  mcp-publisher.tar.gz" | sha256sum -c -

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: mcp-publisher
          path: mcp-publisher.tar.gz
          retention-days: 1

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: npm-package
          path: reachpad-mcp.tgz
          retention-days: 1

  # The ONLY job npm will accept a token from, because it is the only one that
  # names this environment. Only pinned first-party actions and an exact npm
  # version run here. npm is necessarily executable release infrastructure;
  # lifecycle scripts are disabled while bootstrapping it.
  npm:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: npm-publish
    permissions:
      id-token: write # the whole mechanism; without it npm gets no OIDC claim
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: "22", registry-url: "https://registry.npmjs.org" }
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with: { name: npm-package }
      # Node 22 ships npm 10, which predates OIDC publishing entirely. Pin the
      # npm version exactly, and use the same version in verify, so packaging
      # semantics cannot change underneath an unrelated release.
      - name: npm new enough to speak OIDC
        run: |
          npm install -g npm@11.5.1 --ignore-scripts
          actual_npm="$(npm --version)"
          if [ "$actual_npm" != "11.5.1" ]; then
            echo "::error::npm bootstrap installed $actual_npm; expected 11.5.1"
            exit 1
          fi
      # Idempotent only for identical bytes. The unprivileged job packed,
      # installed and smoke-tested this exact tarball. A retry compares its
      # SHA-512 integrity with npm and fails closed if that version contains
      # anything else.
      - name: publish to npm
        run: node scripts/publish-package.mjs reachpad-mcp.tgz

  # The official registry, in the same release rather than as a thing somebody
  # remembers to do afterwards. Most other directories index FROM it, so this
  # is the step that keeps every listing current — and it authenticates with a
  # GitHub OIDC claim, which is why the server name is io.github.reachpad/*: a
  # DNS-verified namespace would need a credential and would make every release
  # manual again.
  #
  # `mcp-publisher login github-oidc` needs `id-token: write` to do its job, so
  # this binary does hold a minting capability and no arrangement of steps
  # removes that. What IS removed is what such a token can reach: no
  # environment claim, so npm refuses it, and `contents: read` on a public
  # repository grants nothing a stranger does not already have. The blast
  # radius is the MCP registry listing, which is the thing this step exists to
  # write.
  registry:
    needs: npm
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with: { name: mcp-publisher }
      # Verified again on this side of the artifact store. Cheap, and it keeps
      # the pinned digest the single thing anyone has to trust.
      - name: re-verify the pinned digest, then unpack
        run: |
          echo "${MCP_PUBLISHER_SHA256}  mcp-publisher.tar.gz" | sha256sum -c -
          tar -xzf mcp-publisher.tar.gz mcp-publisher
          chmod +x ./mcp-publisher
      - name: publish to the MCP registry
        run: |
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish
