name: publish

# A PR bumps the version; PUSHING THE TAG publishes. Nothing outward happens on
# a merge to main, so a release is always a deliberate act.
#
#   git tag v0.1.1 && git push origin v0.1.1
#
# Trusted Publishing (OIDC): there is NO npm token in this repository. npm mints
# a short-lived credential for this workflow in this repository, so there is no
# long-lived secret to steal, rotate, or find in a password manager years from
# now. Configure it once at npmjs.com on the package:
#
#   Settings -> Trusted Publisher -> GitHub Actions
#   org Reachpad · repo reachpad-mcp · workflow publish.yml · environment blank

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write # the whole mechanism; without it npm gets no OIDC claim
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22", registry-url: "https://registry.npmjs.org" }
      # Node 22 ships npm 10, which predates OIDC publishing entirely. A floor
      # rather than @latest, so a future npm cannot change a release out from
      # under us on an unrelated day.
      - name: npm new enough to speak OIDC
        run: npm install -g npm@^11.5.1
      - run: node --test 'test/*.test.mjs'
      - name: the tag must name the version being published
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg=$(node -p "require('./package.json').version")
          if [ "$tag" != "$pkg" ]; then
            echo "tag v$tag does not match package.json $pkg" >&2
            exit 1
          fi
      # Idempotent on purpose. This job has two publishes — npm and the
      # registry — and the first one succeeding while the second fails leaves a
      # release that cannot simply be re-run: npm refuses a version it already
      # has, so the retry dies before reaching the step that actually failed.
      # Skipping an existing version makes the tag re-runnable until BOTH
      # halves are done, which is the only state worth calling released.
      - name: publish to npm
        run: |
          version=$(node -p "require('./package.json').version")
          if npm view "@reachpad/mcp@$version" version >/dev/null 2>&1; then
            echo "@reachpad/mcp@$version is already on npm; leaving it alone"
          else
            npm publish
          fi

      # The official registry, in the same release rather than as a thing
      # somebody remembers to do afterwards. Most other directories index FROM
      # it, so this is the step that keeps every listing current — and it
      # authenticates with the SAME GitHub OIDC claim npm just used, which is
      # why the server name is io.github.reachpad/*: a DNS-verified namespace
      # would need a credential and would make every release manual again.
      - name: publish to the MCP registry
        run: |
          curl -fsSL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_amd64.tar.gz" \
            | tar -xz mcp-publisher
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish

